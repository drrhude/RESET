<style>
/* ---------- RESET paths: homepage doors, rehab/performance hubs, /go/ sales pages ---------- */
/* doors (homepage) */

.rst .pd-door{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;min-height:250px;padding:26px 24px 22px;border-radius:6px;text-decoration:none;color:var(--cream);border:1px solid #50553F;background:linear-gradient(160deg,#4A4E3C 0%,#3F4335 55%,#363A2D 100%);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 18px 30px -16px rgba(17,20,16,.6);transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,border-color .3s}

.rst .pd-door .k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sage)}

.rst .pd-door.lite p{color:var(--grey)}

.rst .pd-door.lite .go{border-color:#D3D1C5}
.rst .pd-door .arr{display:inline-block;transition:transform .35s cubic-bezier(.2,.8,.2,1)}

.rst .pd-door:hover,.rst .pd-door:focus-visible{transform:translateY(-8px);border-color:#6A6F57;box-shadow:0 34px 44px -22px rgba(17,20,16,.6)}
.rst .pd-door:hover:after{width:100%}.rst .pd-door:hover .arr{transform:translateX(6px)}
.rst .pd-quiz{margin-top:14px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:18px 22px;border:1px dashed #B9B7AA;border-radius:6px;background:#FBFAF6}

.rst .pd-quiz span{color:var(--grey);font-size:15px}
/* hubs */
.rst .pd-hero{background:var(--night);color:var(--cream);padding:clamp(48px,7vw,88px) 0 clamp(80px,9vw,112px);background-image:linear-gradient(#1C2019 1px,transparent 1px),linear-gradient(90deg,#1C2019 1px,transparent 1px);background-size:48px 48px}

.rst .pd-hero p{margin-top:14px;max-width:56ch;color:#DAD4C7;font-size:17px}
.rst .pd-hero .crumb{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#B8B3A6}
.rst .pd-hero .crumb a{color:var(--cream)}
.rst .pd-hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.rst .pd-hero .btn{background:var(--cream);color:var(--night);border-color:var(--cream)}
.rst .pd-hero .btn.ghost{background:transparent;color:var(--cream);border-color:rgba(237,230,218,.55)}
.rst .pd-lift{margin-top:-64px;position:relative;z-index:2}
.rst .pd-cards{display:grid;gap:12px}

.rst .pd-card h3{font-size:28px;margin-top:4px}

.rst .pd-card ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}

.rst .pd-card .from{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
.rst .pd-card .free{font-size:14px;color:var(--olive-d);font-weight:700}
.rst .pd-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rst .pd-mini div{border-top:2px solid var(--olive);padding-top:12px}

.rst .pd-other{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}

 .rst .pd-doors,.rst .pd-mini{grid-template-columns:1fr}
 .rst .pd-door{min-height:0}
 .rst .pd-card{grid-template-columns:1fr}
 .rst .pd-card .acts{align-items:stretch;text-align:left}
 .rst .pd-card .acts .btn{text-align:center}
}
/* /go/ sales pages */
.rst .gp-top{position:sticky;top:0;z-index:20;background:rgba(17,20,16,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #262A21}

.rst .gp-hero .btn{background:var(--cream);color:var(--night);border-color:var(--cream)}
.rst .gp-hero .btn:hover{background:transparent;color:var(--cream)}
.rst .gp-hero .note{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#B8B3A6}
.rst .gp-hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px;padding:0;list-style:none}
.rst .gp-hero .chips li{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid rgba(237,230,218,.25);padding:6px 10px;color:#DAD4C7}
.rst .gp-media{position:relative;border:1px solid #2E3229;background:#1C2019;aspect-ratio:4/5;overflow:hidden}
.rst .gp-media img,.rst .gp-media video{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.rst .gp-media .cap{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;background:linear-gradient(180deg,transparent,rgba(17,20,16,.92));font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream)}
.rst .gp-lift{margin-top:-64px;position:relative;z-index:2}
.rst .gp-checks{list-style:none;padding:0;margin:0;display:grid;gap:10px}

.rst .gp-turn{margin-top:22px;padding-top:18px;border-top:1px solid var(--hair);font-family:var(--serif);font-size:clamp(22px,2.4vw,28px);line-height:1.3;max-width:40ch}

.rst .gp-buy{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(20px,4vw,44px);align-items:start}

.rst .gp-main .tag{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--olive)}
.rst .gp-main h3{font-size:clamp(28px,3vw,36px);margin-top:8px}
.rst .gp-main .price{font-family:var(--display);font-weight:500;font-size:56px;line-height:1;margin-top:14px}

.rst .gp-up .btn{margin-top:16px}
.rst .gp-sticky{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(17,20,16,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--cream);border-top:1px solid #2E3229;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.rst .gp-sticky.on{transform:none}
.rst .gp-sticky span{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;line-height:1.3}
.rst .gp-sticky .btn{padding:11px 16px;font-size:12px;background:var(--cream);color:var(--night);border-color:var(--cream);white-space:nowrap}
.rst .gp-foot{background:var(--night);color:#8C8A80;padding:28px 0 calc(90px + env(safe-area-inset-bottom));font-size:13px;line-height:1.55}
.rst .gp-foot a{color:#CFCABD;margin-right:16px}
.rst .gp-foot p{margin-top:12px;max-width:90ch}

 .rst .gp-hero .grid,.rst .gp-buy{grid-template-columns:1fr}
 .rst .gp-media{aspect-ratio:4/3}
 .rst .gp-why{grid-template-columns:1fr 1fr}
 .rst .gp-gets{grid-template-columns:1fr}
 .rst .gp-sticky{display:flex}
 .rst .gp-top .note{display:none}
}
@media (max-width:420px){.rst .gp-why{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.rst .pd-door,.rst .pd-card,.rst .gp-sticky{transition:none}.rst .pd-door:hover,.rst .pd-card:hover{transform:none}}
</style>
